<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love Notes</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Tajawal:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0709;
            color: #e6dedf;
            font-family: 'Playfair Display', 'Tajawal', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* خلفية جمالية هادئة */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 20%, #22121a 0%, #0b0709 70%);
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        /* حماية كلمة المرور للبلاطة الأولى */
        #auth-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80vh;
            gap: 20px;
            text-align: center;
        }

        #auth-screen h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            color: #d4a5b8;
            letter-spacing: 2px;
        }

        .pin-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 165, 184, 0.3);
            border-radius: 30px;
            padding: 12px 24px;
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            width: 250px;
            transition: all 0.3s ease;
        }

        .pin-input:focus {
            border-color: #d4a5b8;
            box-shadow: 0 0 15px rgba(212, 165, 184, 0.2);
        }

        .main-content {
            display: none;
            width: 100%;
            flex-direction: column;
            gap: 40px;
        }

        .section-title {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            color: #d4a5b8;
            text-align: center;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .heart-icon {
            font-size: 1.2rem;
            color: #a8577e;
            display: block;
            text-align: center;
            margin: 5px 0 15px 0;
        }

        .card {
            background: rgba(25, 15, 20, 0.6);
            border: 1px solid rgba(212, 165, 184, 0.15);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .card p {
            font-size: 0.95rem;
            color: #bfaab3;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: rgba(11, 7, 9, 0.6);
            border: 1px solid rgba(212, 165, 184, 0.25);
            border-radius: 12px;
            padding: 15px;
            color: #fff;
            font-family: 'Playfair Display', 'Tajawal', serif;
            font-size: 1rem;
            resize: none;
            outline: none;
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: #d4a5b8;
        }

        .btn {
            background: linear-gradient(135deg, #4a2035, #2b111e);
            color: #f3e6ec;
            border: 1px solid rgba(212, 165, 184, 0.4);
            padding: 12px 30px;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn:hover {
            background: linear-gradient(135deg, #5c2843, #381627);
            border-color: #d4a5b8;
            transform: translateY(-2px);
        }

        /* صندوق الرسائل المحمية */
        .messages-box {
            display: none;
            margin-top: 20px;
            max-height: 350px;
            overflow-y: auto;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-right: 5px;
        }

        .messages-box::-webkit-scrollbar {
            width: 5px;
        }
        .messages-box::-webkit-scrollbar-thumb {
            background: rgba(212, 165, 184, 0.2);
            border-radius: 10px;
        }

        .message-item {
            background: rgba(15, 9, 12, 0.8);
            border-left: 3px solid #d4a5b8;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-word;
            color: #e6dedf;
        }

        .no-messages {
            color: #7d6872;
            font-style: italic;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- شاشة إدخال الرمز السري الأولية -->
        <div id="auth-screen">
            <h1>Our Secret Space</h1>
            <p style="color: #9c8490; font-size: 0.9rem;">Enter the passcode to enter</p>
            <input type="password" id="globalPinInput" class="pin-input" placeholder="Passcode..." onkeypress="checkGlobalPin(event)">
            <button class="btn" onclick="verifyGlobalPin()">Enter ♡</button>
        </div>

        <!-- المحتوى الرئيسي للموقع (يظهر بعد كلمة المرور الصحيحة) -->
        <div id="mainContent" class="main-content">
            
            <!-- قسم كتابة رسالة جديدة -->
            <div class="card">
                <h2 class="section-title">Write something from your heart...</h2>
                <span class="heart-icon">♡</span>
                <p>Write what's on your mind, and your messages will always stay here for everyone.</p>
                
                <textarea id="userNoteInput" placeholder="Write your feelings here..."></textarea>
                <button id="saveBtn" class="btn" onclick="saveMessageToCloud()">Save Note ♡</button>
            </div>

            <!-- قسم صندوق الرسائل المحمي -->
            <div class="card">
                <h2 class="section-title">Protected Messages Box</h2>
                <span class="heart-icon">♡</span>
                <p>Enter the secret password to unlock and read the messages.</p>
                
                <div id="boxAuthSection">
                    <input type="password" id="boxPinInput" class="pin-input" placeholder="Secret password..." style="margin-bottom: 15px;">
                    <br>
                    <button class="btn" onclick="unlockMessagesBox()">Unlock Box ♡</button>
                </div>

                <div id="messagesContainer" class="messages-box" style="display: none;">
                    <!-- ستظهر الرسائل هنا تلقائياً -->
                </div>
            </div>

        </div>
    </div>

    <script>
        // إعدادات JSONBin (ضعي بياناتك هنا)
        const BIN_ID = "ضعِ_معرف_الـBIN_هنا"; 
        const API_KEY = "ضعِ_مفتاح_المستر_كي_هنا";
        
        // الرمز السري المشترك الموحد
        const SECRET_PIN = "i love you";

        // التحقق من الرمز السري الأول لفتح الموقع
        function checkGlobalPin(event) {
            if (event.key === "Enter") {
                verifyGlobalPin();
            }
        }

        function verifyGlobalPin() {
            const enteredPin = document.getElementById("globalPinInput").value.trim();
            if (enteredPin === SECRET_PIN) {
                document.getElementById("auth-screen").style.display = "none";
                document.getElementById("mainContent").style.display = "flex";
            } else {
                alert("Incorrect passcode, please try again ♡");
                document.getElementById("globalPinInput").value = "";
            }
        }

        // حفظ رسالة جديدة في السيرفر مع معالجة المصفوفات والفراغات تلقائياً
        function saveMessageToCloud() {
            const noteText = document.getElementById("userNoteInput").value.trim();
            if (noteText === "") {
                alert("Please write something before saving ♡");
                return;
            }

            const saveBtn = document.getElementById("saveBtn");
            saveBtn.innerText = "Saving... ♡";
            saveBtn.disabled = true;

            // جلب البيانات الحالية من السيرفر
            fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: {
                    "X-Master-Key": API_KEY
                }
            })
            .then(response => {
                if (!response.ok) {
                    return { record: [] };
                }
                return response.json();
            })
            .then(data => {
                let currentMessages = data.record;
                if (!Array.isArray(currentMessages)) {
                    currentMessages = [];
                }
                currentMessages.push(noteText);

                // إرسال البيانات المحدثة للسيرفر
                return fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "X-Master-Key": API_KEY,
                        "X-Bin-Versioning": "false"
                    },
                    body: JSON.stringify(currentMessages)
                });
            })
            .then(response => {
                if (response.ok) {
                    document.getElementById("userNoteInput").value = "";
                    saveBtn.innerText = "Save Note ♡";
                    saveBtn.disabled = false;
                    alert("Note saved successfully! ♡");
                    // إذا كان صندوق الرسائل مفتوحاً، قم بتحديثه فوراً
                    if (document.getElementById("messagesContainer").style.display === "flex") {
                        loadMessages();
                    }
                } else {
                    response.text().then(text => console.log("Server error details:", text));
                    alert("Something went wrong, please try again.");
                    saveBtn.innerText = "Save Note ♡";
                    saveBtn.disabled = false;
                }
            })
            .catch(error => {
                console.log("Connection error:", error);
                alert("Error connecting. Please check your connection.");
                saveBtn.innerText = "Save Note ♡";
                saveBtn.disabled = false;
            });
        }

        // فتح صندوق الرسائل المحمي بكلمة السر
        function unlockMessagesBox() {
            const enteredBoxPin = document.getElementById("boxPinInput").value.trim();
            if (enteredBoxPin === SECRET_PIN) {
                document.getElementById("boxAuthSection").style.display = "none";
                const container = document.getElementById("messagesContainer");
                container.style.display = "flex";
                loadMessages();
            } else {
                alert("Incorrect password for the box ♡");
                document.getElementById("boxPinInput").value = "";
            }
        }

        // جلب وقراءة الرسائل من السيرفر وعرضها
        function loadMessages() {
            const container = document.getElementById("messagesContainer");
            container.innerHTML = "<p class='no-messages'>Loading messages... ♡</p>";

            fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: {
                    "X-Master-Key": API_KEY
                }
            })
            .then(response => response.json())
            .then(data => {
                const messages = data.record;
                container.innerHTML = "";

                if (!Array.isArray(messages) || messages.length === 0) {
                    container.innerHTML = "<p class='no-messages'>No messages yet. Be the first to write one ♡</p>";
                    return;
                }

                // عرض الرسائل (من الأحدث للأقدم)
                messages.reverse().forEach(msg => {
                    const msgDiv = document.createElement("div");
                    msgDiv.className = "message-item";
                    msgDiv.innerText = msg;
                    container.appendChild(msgDiv);
                });
            })
            .catch(error => {
                console.log("Error loading messages:", error);
                container.innerHTML = "<p class='no-messages'>Failed to load messages.</p>";
            });
        }
    </script>
</body>
</html>
